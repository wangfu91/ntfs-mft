name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check-tag:
    name: Check release tag
    # Publish only newly created tags, not tag updates or deletions.
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match tag to package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              package = tomllib.load(manifest)["package"]
          expected = f"v{package['version']}"
          tag = os.environ["RELEASE_TAG"]
          if tag != expected:
              raise SystemExit(f"Tag {tag!r} must match Cargo.toml version {expected!r}")

          with open("Cargo.lock", "rb") as lockfile:
              packages = tomllib.load(lockfile)["package"]
          if not any(p["name"] == package["name"] and p["version"] == package["version"]
                     and "source" not in p for p in packages):
              raise SystemExit("Cargo.lock must match the package version in Cargo.toml")
          print(f"Validated release {tag}")
          PY

  validate:
    name: Validate release
    needs: check-tag
    uses: ./.github/workflows/rust.yml

  publish:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: stable-ubuntu-latest
          save-if: false
      - name: Build and publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Set the CARGO_REGISTRY_TOKEN repository secret to a crates.io publishing token."
            exit 1
          fi
          cargo publish --package ntfs-mft --registry crates-io --locked
