name: Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Use a separate group from the calling publish workflow.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Verify sparse-volume fixtures
        run: python tests/fixtures/sparse-volume-fixture/verify.py
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: stable-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Test crate
        run: cargo test --locked
      - name: Test differential harness
        run: cargo test --manifest-path differential-tests/Cargo.toml --locked --lib differential_tests
      - name: Test integration harness
        run: cargo test --manifest-path integration-tests/Cargo.toml --locked
      - name: Check documentation
        run: cargo doc --package ntfs-mft --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # A publish dry run also packages and verifies the portable source crate.
      - name: Verify crate package
        if: runner.os == 'Linux'
        run: cargo publish --package ntfs-mft --registry crates-io --dry-run --locked
