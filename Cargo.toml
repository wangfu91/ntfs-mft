[package]
name = "ntfs-mft"
version = "0.1.0"
edition = "2024"
autoexamples = false
exclude = ["integration-tests/**", "differential-tests/**"]
description = "Read-only raw NTFS Master File Table parsing and serial/parallel scanning on Windows and Linux."
license = "MIT"
repository = "https://github.com/wangfu91/ntfs-mft"
keywords = ["filesystem", "ntfs", "mft", "forensics"]
categories = ["filesystem"]

[package.metadata.docs.rs]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "i686-pc-windows-msvc",
]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ntfs_mft_differential)'] }

[dependencies]
bitflags = "2"
log = "0.4"
rustc-hash = "2"
thiserror = "2"
zerocopy = { version = "0.8.48", features = ["derive"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_WindowsProgramming",
    "Win32_System_Ioctl",
    "Win32_System_Time",
    "Win32_System_Threading",
]

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1"
schemars = "1"
jsonschema = { version = "0.33", default-features = false }

[[example]]
name = "raw_mft_read"
path = "examples/raw_mft_read.rs"

[[example]]
name = "raw_mft_serial_read"
[[example]]
name = "raw_mft_serial_read_profile"
[[example]]
name = "raw_mft_parallel_chunks"
[[example]]
name = "raw_mft_parallel_ingest_profile"
[[example]]
name = "deletion_forensic"

[[bench]]
name = "raw_mft"
harness = false

[[bench]]
name = "raw_mft_ingest"
harness = false

[target.'cfg(windows)'.dev-dependencies]
injectorpp = "0.5"

[profile.test]
opt-level = 0
debug = true
incremental = false

[profile.bench]
lto = "thin"

[profile.release]
debug = true

[features]
windows-examples = []
serde = ["dep:serde", "dep:chrono"]
jsonl = ["serde", "dep:serde_json"]

[[example]]
name = "raw_mft_export"
required-features = ["jsonl"]
test = true

[[bench]]
name = "path_resolver"
harness = false
required-features = ["windows-examples"]
