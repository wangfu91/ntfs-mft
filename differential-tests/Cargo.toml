[package]
name = "ntfs-mft-differential-tests"
version = "0.0.0"
edition = "2024"
publish = false
autotests = false

# Compile the actual library source so tests can access the private parser.
[lib]
name = "ntfs_mft"
path = "../src/lib.rs"
doctest = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[features]
windows-examples = []

# Keep this block identical to the root manifest. build.rs checks for drift.
[dependencies]
bitflags = "2"
log = "0.4"
rustc-hash = "2"
thiserror = "2"
zerocopy = { version = "0.8.48", features = ["derive"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_WindowsProgramming",
    "Win32_System_Ioctl",
    "Win32_System_Time",
    "Win32_System_Threading",
]

[dev-dependencies]
mft = { git = "https://github.com/omerbenamram/mft", rev = "dc36db7d3b83d68c0eecb75225c9955cfd7b2f2d", default-features = false }

[target.'cfg(windows)'.dev-dependencies]
injectorpp = "0.5"

[profile.test]
incremental = false
