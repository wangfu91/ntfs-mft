[package]
name = "ntfs-mft-differential-tests"
version = "0.0.0"
edition = "2024"
publish = false
autotests = false

# Compile the actual library source so tests can access the private parser.
[lib]
name = "ntfs_mft"
path = "../src/lib.rs"
doctest = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"


[dependencies]
bitflags.workspace = true
log.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
zerocopy.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true

[dev-dependencies]
serde_json.workspace = true
mft.workspace = true

[target.'cfg(windows)'.dev-dependencies]
injectorpp.workspace = true
